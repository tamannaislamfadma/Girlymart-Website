<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Custom Requests')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main-content">
        <h2 class="page-heading">🎨 Custom Order Requests</h2>
        <table class="admin-table">
            <thead>
            <tr><th>Image</th><th>Description</th><th>WhatsApp</th><th>Date</th></tr>
            </thead>
            <tbody>
            <tr th:each="req : ${requests}">
                <td><img th:if="${req.imageUrl != null}" th:src="${req.imageUrl}" style="width:70px;height:70px;object-fit:cover;border-radius:6px;" alt=""/></td>
                <td th:text="${req.description}"></td>
                <td><a th:href="'https://wa.me/' + ${req.whatsappNumber}" target="_blank" th:text="${req.whatsappNumber}"></a></td>
                <td th:text="${req.submittedAt}"></td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
