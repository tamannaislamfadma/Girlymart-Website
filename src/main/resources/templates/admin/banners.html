<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Banners')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main-content">
        <h2 class="page-heading">🖼️ Manage Banners</h2>
        <div class="admin-form-card">
            <h3>Add Banner</h3>
            <form th:action="@{/admin/banners/save}" method="post" enctype="multipart/form-data" th:object="${newBanner}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <select th:field="*{type}" required>
                    <option value="HERO">Hero Banner</option>
                    <option value="AD">Ad Carousel</option>
                </select>
                <input type="number" th:field="*{sortOrder}" placeholder="Sort Order (1, 2, 3...)"/>
                <input type="file" name="image" accept="image/*" required/>
                <button type="submit" class="btn-pink">Upload Banner</button>
            </form>
        </div>
        <table class="admin-table">
            <thead>
            <tr><th>Image</th><th>Type</th><th>Order</th><th>Action</th></tr>
            </thead>
            <tbody>
            <tr th:each="banner : ${banners}">
                <td><img th:src="${banner.imageUrl}" style="width:100px;height:50px;object-fit:cover;border-radius:6px;" alt=""/></td>
                <td th:text="${banner.type}"></td>
                <td th:text="${banner.sortOrder}"></td>
                <td>
                    <a th:href="@{/admin/banners/delete/{id}(id=${banner.id})}"
                       onclick="return confirm('Delete this banner?')" class="btn-danger">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
