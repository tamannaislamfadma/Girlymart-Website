<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Products')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main-content">
        <h2 class="page-heading">📦 Manage Products</h2>

        <div class="admin-form-card">
            <h3>Add New Product</h3>
            <form th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data" th:object="${newProduct}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="text" th:field="*{name}" placeholder="Product Name" required/>
                <textarea th:field="*{description}" placeholder="Description" rows="3"></textarea>
                <input type="number" th:field="*{price}" placeholder="Price (৳)" step="0.01" required/>
                <select th:field="*{category}" required>
                    <option value="">Select Category</option>
                    <option value="Bangles">Bangles</option>
                    <option value="Crochet Bag">Crochet Bag</option>
                    <option value="Crochet Cat Outfit">Crochet Cat Outfit</option>
                    <option value="Crochet Keyring">Crochet Keyring</option>
                    <option value="Crochet Others">Crochet Others</option>
                    <option value="Bowclip">Bowclip</option>
                </select>
                <input type="text" th:field="*{sizeInfo}" placeholder="Size or Weight (Leave blank for Bangles)"/>
                <input type="number" th:field="*{stock}" placeholder="Stock Quantity"/>
                <input type="file" name="image" accept="image/*"/>
                <button type="submit" class="btn-pink">Add Product</button>
            </form>
        </div>

        <table class="admin-table">
            <thead>
            <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td><img th:src="${product.imageUrl}" style="width:50px;height:50px;object-fit:cover;border-radius:6px;" alt=""/></td>
                <td th:text="${product.name}"></td>
                <td th:text="${product.category}"></td>
                <td th:text="'৳ ' + ${product.price}"></td>
                <td th:text="${product.stock}"></td>
                <td>
                    <a th:href="@{/admin/products/delete/{id}(id=${product.id})}"
                       onclick="return confirm('Delete this product?')" class="btn-danger">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
