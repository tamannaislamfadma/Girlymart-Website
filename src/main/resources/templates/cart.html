<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cart')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main-content">
        <h2 class="page-heading">🛒 Your Cart</h2>
        <div th:if="${cartItems.isEmpty()}" class="empty-msg">Your cart is empty.</div>
        <div th:if="${!cartItems.isEmpty()}">
            <table class="cart-table">
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Subtotal</th>
                    <th>Remove</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td>
                        <img th:src="${item.product.imageUrl}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;" alt=""/>
                        <span th:text="${item.product.name}"></span>
                    </td>
                    <td th:text="'৳ ' + ${item.product.price}"></td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="'৳ ' + ${item.product.price * item.quantity}"></td>
                    <td>
                        <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-danger">✕</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="cart-total">
                <strong>Total: ৳ <span th:text="${total}"></span></strong>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
