<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main-content">
        <div class="auth-card">
            <h2>🆕 Create Account</h2>
            <div th:if="${error}" class="alert error" th:text="${error}"></div>
            <form th:action="@{/register}" method="post" th:object="${registerDTO}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label>Phone Number</label>
                <input type="text" th:field="*{phone}" placeholder="01XXXXXXXXX" required/>
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="Password" required/>
                <label>Full Name</label>
                <input type="text" th:field="*{name}" placeholder="Your Name" required/>
                <label>Address</label>
                <input type="text" th:field="*{address}" placeholder="Your Address"/>
                <label>Delivery Phone Number</label>
                <input type="text" th:field="*{deliveryPhone}" placeholder="01XXXXXXXXX"/>
                <button type="submit" class="btn-pink full-width">Register</button>
            </form>
            <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
