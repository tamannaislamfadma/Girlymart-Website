<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="main-content">
        <div class="auth-card">
            <h2>🔑 Login to GirlyMart</h2>
            <div th:if="${param.error}" class="alert error">Invalid phone or password.</div>
            <div th:if="${param.registered}" class="alert success">Registered! Please login.</div>
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label>Phone Number</label>
                <input type="text" name="username" placeholder="01XXXXXXXXX" required/>
                <label>Password</label>
                <input type="password" name="password" placeholder="Password" required/>
                <button type="submit" class="btn-pink full-width">Login</button>
            </form>
            <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
